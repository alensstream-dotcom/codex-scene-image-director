name: patch-v5-followup
on:
  push:
    branches: [chatgpt/v5-stateful-director]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v5-stateful-director
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply focused refinements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index-v5.js')
          text = index.read_text(encoding='utf-8')
          text = text.replace('    seedForShotV5,\n    selectShotsV5,\n} from \'./lib/director-v5.mjs\';', '    seedForShotV5,\n} from \'./lib/director-v5.mjs\';\nimport { selectShotsV5 } from \'./lib/selector-v5.mjs\';')
          text = text.replace("!node.matches('.janima-autocg-slot, .janima-autocg-anchor-marker')", "!node.matches('.janima-autocg-slot, .janima-autocg-anchor-marker, .janima-autocg-anchor-errors')")
          index.write_text(text, encoding='utf-8')

          tests = Path('tests/director-v5.test.mjs')
          text = tests.read_text(encoding='utf-8')
          text = text.replace('    selectShotsV5,\n    splitStoryWithSpans,', '    splitStoryWithSpans,')
          text = text.replace("} from '../lib/director-v5.mjs';\nimport { canonicalText }", "} from '../lib/director-v5.mjs';\nimport { selectShotsV5 } from '../lib/selector-v5.mjs';\nimport { canonicalText }")
          text = text.replace("assert.equal(canonicalText('  她说：“你好”\\n然后离开。 '), '她说:\"你好\" 然后离开。');", "assert.equal(canonicalText('  她说：“你好”\\n然后离开。 '), '她说：\"你好\" 然后离开。');")
          tests.write_text(text, encoding='utf-8')

          director = Path('lib/director-v5.mjs')
          text = director.read_text(encoding='utf-8')
          text = text.replace("        defaultOutfit: englishTags(raw.default_outfit || raw.defaultOutfit || raw.outfit).join(', '),", "        defaultOutfit: '',")
          text = text.replace("        if (event?.charactersPresent?.length) activeCharacters = event.charactersPresent;", "        if (event) activeCharacters = event.charactersPresent || [];")
          text = text.replace('Then list only real state-changing events: character presence, explicit outfit changes, explicit location changes, and adult stage.', 'Then return exactly one event object for every supplied paragraph so character presence is never guessed from a previous scene. Outfit and location updates must still be evidence-backed.')
          text = text.replace('"characters":[{"name":"exact name","identity":"English stable hair, eyes, face, body tags","default_outfit":"English outfit only when established"}],', '"characters":[{"name":"exact name","identity":"English stable hair, eyes, face, body tags"}],')
          old_people = """function peopleTag(characters = []) {
    const count = characters.length;
    if (count <= 0) return 'story characters';
    if (count === 1) return '1girl';
    if (count === 2) return '2people';
    return `${count}people`;
}"""
          new_people = """function peopleTag(characters = []) {
    const count = characters.length;
    if (count <= 0) return 'story characters';
    const female = characters.filter(item => /(?:woman|female|girl|wife|lady)/i.test(item.identity || '')).length;
    const male = characters.filter(item => /(?:man|male|boy|husband)/i.test(item.identity || '')).length;
    if (count === 1) return male === 1 ? '1boy' : '1girl';
    if (female && male) return `${female}girl${female > 1 ? 's' : ''}, ${male}boy${male > 1 ? 's' : ''}`;
    if (female === count) return `${count}girls`;
    if (male === count) return `${count}boys`;
    return `${count}people`;
}"""
          if old_people not in text:
              raise SystemExit('peopleTag target missing')
          text = text.replace(old_people, new_people)
          director.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/test.yml')
          text = workflow.read_text(encoding='utf-8')
          if 'node --check lib/selector-v5.mjs' not in text:
              text = text.replace('node --check lib/director-v5.mjs', 'node --check lib/director-v5.mjs\n          node --check lib/selector-v5.mjs')
          workflow.write_text(text, encoding='utf-8')
          PY
          node --check index-v5.js
          node --check lib/director-v5.mjs
          node --check lib/selector-v5.mjs
          node --test tests/director-v5.test.mjs
      - name: Commit refinements and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/patch-v5-followup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-v5.js lib/director-v5.mjs lib/selector-v5.mjs tests/director-v5.test.mjs .github/workflows/test.yml .github/workflows/patch-v5-followup.yml
          git commit -m "fix: refine V5 state evidence and MMR selection"
          git push origin HEAD:chatgpt/v5-stateful-director
