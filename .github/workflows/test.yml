name: test

on:
  pull_request:
  push:
    branches: [master]

jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check runtime syntax
        run: |
          node --check index-v3.1.js
          node --check index-v3.js
          node --check lib/director-v3.mjs
          node --check lib/scene-lock-v3.mjs
          node --check lib/comfy-direct.mjs
          node --check lib/anima-direct-workflow.mjs
      - name: Run tests
        id: tests
        shell: bash
        run: |
          set +e
          node --test tests/*.test.mjs 2>&1 | tee test-output.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.txt
