name: test

on:
  pull_request:
  push:
    branches: [master]

jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check runtime syntax
        run: |
          node --check index-v2.5.js
          node --check lib/scene-grounding.mjs
      - name: Run tests
        run: node --test tests/*.test.mjs
