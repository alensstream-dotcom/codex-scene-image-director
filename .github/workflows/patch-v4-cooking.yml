name: patch-v4-cooking

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v4-quiet-director
      - name: Patch cooking visibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/director-v4.mjs')
          text = path.read_text(encoding='utf-8')
          old = "const VISUAL_RE = /(?:走|跑|坐|站|跪|躺|推|拉|抱|吻|抓|握|拔|挥|劈|刺|练|舞|跳|回头|转身|探头|开门|递|喂|抚|摸|按|脱|穿|进入|抽动|高潮|弹琴|做饭|烹饪|walk|run|sit|stand|kneel|lie|push|pull|embrace|kiss|grab|hold|draw|swing|stab|turn|peek|open|feed|touch|undress|penetrat|climax|play|cook)/i;"
          new = "const VISUAL_RE = /(?:走|跑|坐|站|跪|躺|推|拉|抱|吻|抓|握|拔|挥|劈|刺|练|舞|跳|回头|转身|探头|开门|递|喂|抚|摸|按|脱|穿|进入|抽动|高潮|弹琴|做饭|做鱼|烹鱼|烹饪|下厨|walk|run|sit|stand|kneel|lie|push|pull|embrace|kiss|grab|hold|draw|swing|stab|turn|peek|open|feed|touch|undress|penetrat|climax|play|cook)/i;"
          if old not in text:
              raise SystemExit('VISUAL_RE target missing')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/director-v4.mjs
          git commit -m "fix: treat cooking as a drawable V4 scene"
          git push origin HEAD:chatgpt/v4-quiet-director
