<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../style.css"><title>段落插图定位回归</title>
<style>body{font:18px/1.8 sans-serif;max-width:850px;margin:24px auto;padding:12px}.mes_text{padding:16px;background:#fafafa}p{margin:16px 0}.ad-owned-image{width:180px!important}</style>
<main id="test"></main><script type="module">
import {mountSceneButtons} from '../scene-buttons.mjs';
import {sourceHash,scenePrompt} from '../scene-planner.mjs';
const checks=[],host=document.querySelector('#test'),marker=id=>'image###'+scenePrompt(id,1)+'###';
function check(name,value){if(!value)throw new Error(name);checks.push(name);}
function setup(raw,html,{ids=['one'],images=[],manual=false}={}){host.innerHTML='<article class="mes" mesid="0"><div class="mes_text"></div></article>';const row=host.firstElementChild,text=row.firstElementChild;text.innerHTML=html;const scenes=Object.fromEntries(ids.map(id=>[id,{id,revision:1,message_id:0,swipe_id:0,source_hash:sourceHash(raw),images,manual}]));const message={mes:raw,is_user:false,swipe_id:0};const mount=()=>mountSceneButtons(row,{message,scenes,onGenerate:id=>window.generated=id});return {row,text,message,scenes,mount};}
const para='程瑶在走廊里拿着咖啡杯。',after='她走到办公室门前，停下来整理袖口。';
try{
let s=setup(para+'\n\n'+marker('one')+'\n\n'+after+'\n<status>时间与地点</status>','<p>'+para+'</p><p>'+after+'</p><aside>时间与地点</aside>');s.mount();let b=s.text.querySelector('.ad-scene-block');check('automatic button follows its paragraph before later prose and status',b.previousElementSibling?.textContent===para&&b.nextElementSibling?.textContent===after);b.querySelector('button').click();check('relocated button keeps scene handler',window.generated==='one');
const image=document.createElement('img');image.className='ad-owned-image';image.src='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="140"><rect width="100" height="140" fill="lightblue"/></svg>';s.scenes.one.images=['saved'];b.querySelector('span[data-request-id]').append(image);s.text.append(b);s.mount();check('existing bottom image is repaired without replacing its DOM or source',s.text.querySelector('img')===image&&b.previousElementSibling.textContent===para);
let mutations=0;const observer=new MutationObserver(r=>mutations+=r.filter(v=>v.type==='childList'&&[...v.addedNodes,...v.removedNodes].includes(b)).length);observer.observe(s.text,{childList:true,subtree:true});for(let i=0;i<12;i++)s.mount();await new Promise(r=>setTimeout(r,0));observer.disconnect();check('repeated refresh does not move controls or duplicate images',mutations===0&&s.text.querySelectorAll('img').length===1);
s=setup('程瑶**端起咖啡**'+marker('one')+'，随后放在窗台上。','<p>程瑶<strong>端起咖啡</strong>，随后放在窗台上。</p>',{manual:true});s.mount();b=s.text.querySelector('.ad-scene-block');check('manual mid-paragraph selection stays before the remaining text',b.parentElement.tagName==='P'&&b.previousElementSibling?.textContent==='端起咖啡'&&b.nextSibling?.textContent.includes('随后'));check('Markdown emphasis and prose are retained',s.text.querySelector('strong').textContent==='端起咖啡');
s=setup(para+'\n'+marker('one')+'\n'+para+'\n'+marker('two')+'\n'+after,'<p>'+para+'</p><p>'+para+'</p><p>'+after+'</p>',{ids:['one','two']});s.mount();check('identical paragraphs retain separate occurrence positions',[...s.text.children].map(n=>n.dataset.adScene||n.tagName).join(',')==='P,one,P,two,P');
s=setup(para+'\n'+marker('one')+'\n'+marker('two')+'\n'+after,'<p>'+para+'</p><p>'+after+'</p>',{ids:['one','two']});s.mount();check('scenes at the same prose boundary retain source order',[...s.text.querySelectorAll('.ad-scene-block')].map(n=>n.dataset.adScene).join(',')==='one,two');
const m=marker('one');s=setup(para+m+after,'<p>'+para+'<span>'+m.slice(0,22)+'</span><em>'+m.slice(22)+'</em>'+after+'</p>');s.mount();check('split text-node marker is removed without deleting following prose',!s.text.textContent.includes('ADSCENE')&&s.text.textContent.includes(after));
s=setup('<details><summary>想法</summary>另一个画面</details>\n\n她说：“咖啡 &amp; 牛奶”。'+marker('one')+'\n\n'+after,'<details><summary>想法</summary>另一个画面</details><p>她说：<q>“咖啡 &amp; 牛奶”</q>。</p><p>'+after+'</p>');s.mount();b=s.text.querySelector('.ad-scene-block');check('entities, quote formatting and collapsed reasoning do not shift anchors',b.previousElementSibling?.tagName==='P'&&b.nextElementSibling?.textContent===after);
s=setup(para+marker('one')+after,'<p>'+para+'</p><p>'+after+'</p><span class="ad-scene-anchor" data-ad-scene="one"></span>');s.mount();check('host anchors already rendered at the bottom are relocated',s.text.querySelector('.ad-scene-block').previousElementSibling?.textContent===para);
s=setup('已被隐藏的唯一原段落。'+marker('one')+'\n'+after,'<p>'+after+'</p>');s.mount();check('fully hidden prose is explicitly unlocated instead of pretending to match another paragraph',s.text.firstElementChild.classList.contains('ad-scene-unplaced')&&s.text.firstElementChild.textContent.includes('原段落已隐藏'));
s=setup(para+marker('one')+'\n'+para,'<p>'+para+'</p>');s.mount();check('a hidden duplicate is never assigned to the remaining occurrence',s.text.querySelector('.ad-scene-block').classList.contains('ad-scene-unplaced'));
s.message.mes='完全修改后的正文。';s.mount();check('stale controls are removed after prose changes',s.text.querySelectorAll('.ad-scene-block').length===0);
s=setup(para+marker('one')+after,'<p>'+para+'</p><p>'+after+'</p>',{images:['saved']});s.mount();check('saved images hydrate in the paragraph block',s.text.querySelector('img').closest('.ad-scene-block').previousElementSibling?.textContent===para);check('controls fit mobile width',document.documentElement.scrollWidth<=innerWidth+1);
window.scenePlacementReport={passed:true,checks};
}catch(error){window.scenePlacementReport={passed:false,checks,error:String(error)};throw error;}
</script></html>
